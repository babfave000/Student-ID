<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <style>
    .table { fill: #eff6ff; stroke: #1e3a8a; stroke-width: 2; }
    .header-bg { fill: #2563eb; }
    .header { fill: #ffffff; font: bold 16px sans-serif; }
    .column { fill: #0f172a; font: 14px sans-serif; }
    .line { stroke: #1e3a8a; stroke-width: 2; marker-end: url(#arrow); }
    .label { fill: #1e40af; font: 13px sans-serif; }
    .shadow { filter: url(#shadow); }
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1e3a8a" />
    </marker>
  </defs>

  <rect class="table shadow" x="40" y="40" width="320" height="220" rx="16" />
  <rect class="header-bg" x="40" y="40" width="320" height="36" rx="16" />
  <text class="header" x="60" y="64">students</text>
  <text class="column" x="60" y="100">id PK</text>
  <text class="column" x="60" y="124">matric_no</text>
  <text class="column" x="60" y="148">first_name</text>
  <text class="column" x="60" y="172">last_name</text>
  <text class="column" x="60" y="196">email</text>
  <text class="column" x="60" y="220">phone, faculty, department, level</text>

  <rect class="table shadow" x="420" y="40" width="320" height="240" rx="16" />
  <rect class="header-bg" x="420" y="40" width="320" height="36" rx="16" />
  <text class="header" x="440" y="64">staff_users</text>
  <text class="column" x="440" y="100">id PK</text>
  <text class="column" x="440" y="124">username</text>
  <text class="column" x="440" y="148">password_hash</text>
  <text class="column" x="440" y="172">full_name</text>
  <text class="column" x="440" y="196">email</text>
  <text class="column" x="440" y="220">role</text>

  <rect class="table shadow" x="40" y="300" width="420" height="240" rx="16" />
  <rect class="header-bg" x="40" y="300" width="420" height="36" rx="16" />
  <text class="header" x="60" y="324">id_registrations</text>
  <text class="column" x="60" y="360">id PK</text>
  <text class="column" x="60" y="384">student_id FK -> students.id</text>
  <text class="column" x="60" y="408">photo_path</text>
  <text class="column" x="60" y="432">status</text>
  <text class="column" x="60" y="456">submitted_at</text>

  <rect class="table shadow" x="520" y="340" width="320" height="200" rx="16" />
  <rect class="header-bg" x="520" y="340" width="320" height="36" rx="16" />
  <text class="header" x="540" y="364">production_batches</text>
  <text class="column" x="540" y="400">id PK</text>
  <text class="column" x="540" y="424">batch_name</text>
  <text class="column" x="540" y="448">description</text>
  <text class="column" x="540" y="472">created_by FK -> staff_users.id</text>
  <text class="column" x="540" y="496">status</text>

  <rect class="table shadow" x="880" y="300" width="280" height="180" rx="16" />
  <rect class="header-bg" x="880" y="300" width="280" height="36" rx="16" />
  <text class="header" x="900" y="324">batch_registrations</text>
  <text class="column" x="900" y="360">id PK</text>
  <text class="column" x="900" y="384">batch_id FK -> production_batches.id</text>
  <text class="column" x="900" y="408">registration_id FK -> id_registrations.id</text>
  <text class="column" x="900" y="432">added_at</text>

  <rect class="table shadow" x="420" y="580" width="380" height="160" rx="16" />
  <rect class="header-bg" x="420" y="580" width="380" height="36" rx="16" />
  <text class="header" x="440" y="604">audit_log</text>
  <text class="column" x="440" y="640">id PK</text>
  <text class="column" x="440" y="664">action</text>
  <text class="column" x="440" y="688">entity_type</text>
  <text class="column" x="440" y="712">entity_id</text>
  <text class="column" x="440" y="736">user_id, user_type</text>

  <rect class="table shadow" x="40" y="580" width="340" height="160" rx="16" />
  <rect class="header-bg" x="40" y="580" width="340" height="36" rx="16" />
  <text class="header" x="60" y="604">notification_logs</text>
  <text class="column" x="60" y="640">id PK</text>
  <text class="column" x="60" y="664">registration_id FK -> id_registrations.id</text>
  <text class="column" x="60" y="688">recipient_email</text>
  <text class="column" x="60" y="712">notification_type</text>
  <text class="column" x="60" y="736">status, sent_at</text>

  <line class="line" x1="200" y1="300" x2="200" y2="260" />
  <text class="label" x="210" y="280">student_id</text>
  <path class="line" d="M 200 300 L 200 280 L 140 280" />
  <line class="line" x1="630" y1="540" x2="630" y2="520" />
  <text class="label" x="640" y="530">created_by</text>
  <line class="line" x1="700" y1="388" x2="880" y2="388" />
  <text class="label" x="760" y="378">batch_id</text>
  <line class="line" x1="630" y1="460" x2="470" y2="460" />
  <text class="label" x="560" y="450">registration_id</text>
  <line class="line" x1="350" y1="680" x2="350" y2="520" />
  <text class="label" x="270" y="620" transform="rotate(-90 270 620)">registration_id</text>
</svg>
