<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #eff6ff; stroke: #1e3a8a; stroke-width: 2; rx: 18; ry: 18; filter: url(#shadow); }
    .text-title { font: bold 18px sans-serif; fill: #1e3a8a; }
    .text-body { font: 14px sans-serif; fill: #0f172a; }
    .line { stroke: #1e3a8a; stroke-width: 2; marker-end: url(#arrow); }
    .label { font: 13px sans-serif; fill: #1e40af; }
    .accent { fill: #2563eb; }
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1e3a8a" />
    </marker>
  </defs>

  <rect class="box" x="50" y="60" width="520" height="260" />
  <text class="text-title" x="80" y="100">Frontend</text>
  <text class="text-body" x="80" y="130">React + Vite application</text>
  <text class="text-body" x="80" y="155">Pages: Login, Student Dashboard,</text>
  <text class="text-body" x="80" y="175">Registration, Admin Dashboard,</text>
  <text class="text-body" x="80" y="195">Batch Management</text>
  <text class="text-body" x="80" y="220">Auth context + protected routes</text>
  <text class="text-body" x="80" y="245">Axios API service</text>
  <text class="text-body" x="80" y="270">Tailwind CSS styling</text>

  <rect class="box" x="320" y="360" width="560" height="340" />
  <text class="text-title" x="360" y="400">Backend</text>
  <text class="text-body" x="360" y="430">Node.js + Express API server</text>
  <text class="text-body" x="360" y="455">Routes: /api/auth, /api/registrations,</text>
  <text class="text-body" x="360" y="475">/api/admin, /api/health</text>
  <text class="text-body" x="360" y="500">Controllers handle requests and responses</text>
  <text class="text-body" x="360" y="520">Middleware for auth, validation, errors</text>
  <text class="text-body" x="360" y="540">Services: workflow, notifications</text>
  <text class="text-body" x="360" y="560">File uploads saved to backend/uploads</text>
  <text class="text-body" x="360" y="580">JWT-based authentication</text>
  <text class="text-body" x="360" y="600">Nodemailer for email notifications</text>
  <text class="text-body" x="360" y="620">Static /uploads route for photos</text>

  <rect class="box" x="920" y="60" width="240" height="260" />
  <text class="text-title" x="950" y="100">Database</text>
  <text class="text-body" x="950" y="130">MySQL relational database</text>
  <text class="text-body" x="950" y="155">Tables: students, staff_users,</text>
  <text class="text-body" x="950" y="175">id_registrations, production_batches,</text>
  <text class="text-body" x="950" y="195">batch_registrations, audit_log,</text>
  <text class="text-body" x="950" y="215">notification_logs</text>
  <text class="text-body" x="950" y="245">Foreign keys enforce data integrity</text>

  <rect class="box" x="50" y="360" width="220" height="200" />
  <text class="text-title" x="70" y="400">Users</text>
  <text class="text-body" x="70" y="430">Students and staff access UI</text>
  <text class="text-body" x="70" y="455">Student portal for registration</text>
  <text class="text-body" x="70" y="480">Staff portal for approvals &amp; batches</text>

  <line class="line" x1="290" y1="190" x2="320" y2="190" />
  <text class="label" x="300" y="180">HTTP/HTTPS</text>

  <line class="line" x1="420" y1="620" x2="420" y2="700" />
  <text class="label" x="430" y="660" transform="rotate(90 430 660)">JDBC / MySQL driver</text>

  <line class="line" x1="1120" y1="260" x2="1120" y2="360" />
  <text class="label" x="916" y="330">Queries / DB access</text>

  <rect class="box" x="460" y="220" width="280" height="80" />
  <text class="text-title" x="500" y="250">File Storage</text>
  <text class="text-body" x="500" y="280">Uploads directory for photos</text>

  <line class="line" x1="580" y1="360" x2="700" y2="360" />
  <text class="label" x="610" y="350">Photo uploads</text>

  <line class="line" x1="280" y1="360" x2="360" y2="360" />
  <text class="label" x="300" y="348">API requests</text>

  <line class="line" x1="740" y1="520" x2="920" y2="260" />
  <text class="label" x="780" y="420">Data persistence</text>

  <rect x="450" y="700" width="300" height="60" rx="14" ry="14" fill="#e2e8f0" stroke="#0f172a" stroke-width="2" />
  <text class="text-body" x="470" y="735">Deployment: Backend runs on Node.js, Frontend deployed via Vite/static host</text>
</svg>
